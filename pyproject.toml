[project]
name = "you-left-a-scent"
version = "0.1.0"
description = "A deterministic fragrance-vibe generator."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "rapidfuzz>=3.9,<4",
    "uvicorn[standard]>=0.30,<1",
]

[tool.vercel]
entrypoint = "you_left_a_scent.web:app"
